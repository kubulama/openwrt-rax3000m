name: openwrt-staged

on:
  workflow_dispatch:
    inputs:
      OP_IP:
        description: '静态IP地址'
        required: false
        default: '192.168.2.1'
        type: string
      OP_author:
        description: '定制作者'
        required: false
        default: 'kubulama'
        type: string
      CUSTOM_PLUGINS:
        description: '自定义插件名称，用空格分隔'
        required: false
        default: 'luci-app-zerotier luci-app-socat luci-app-samba4 luci-theme-m3e luci-app-ttyd luci-app-diskman luci-app-daed luci-i18n-daed-zh-cn'
        type: string
      BUILD_DATE:
        description: '固件发布日期，留空则使用当天日期'
        required: false
        default: '20260824'
        type: string

permissions:
  contents: write

env:
  DIY_P1_SH: sh/op.sh
  SOURCE_NAME: openwrt
  REPO_URL: https://github.com/shiyu1314/openwrt-source
  REPO_BRANCH: openwrt-25.12
  DEVICE_NAME: mt7981-multi

jobs:
  prepare-source:
    name: 1.prepare-source
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      build_date: ${{ steps.vars.outputs.build_date }}
    steps:
      - name: 1.1.checkout-control-repo
        uses: actions/checkout@v6

      - name: 1.2.install-build-env
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo docker image prune -a -f || true
          sudo systemctl stop docker || true
          sudo apt-get update
          sudo apt-get install -y tar build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3 python3-pip python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget subversion patch upx-ucl autoconf automake curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 uglifyjs msmtp texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev rename qemu-utils clang llvm
          sudo apt-get clean
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'noreply@github.com'
          sudo timedatectl set-timezone 'Asia/Shanghai'

      - name: 1.3.set-build-date
        id: vars
        run: |
          TAG="${{ github.event.inputs.BUILD_DATE }}"
          [ -n "$TAG" ] || TAG="$(date +'%Y%m%d')"
          echo "build_date=$TAG" >> "$GITHUB_OUTPUT"

      - name: 1.4.restore-download-cache
        uses: actions/cache/restore@v5
        with:
          path: /workdir/openwrt/dl
          key: openwrt-staged-${{ env.DEVICE_NAME }}-${{ env.REPO_BRANCH }}-downloads-${{ github.run_id }}
          restore-keys: |
            openwrt-staged-${{ env.DEVICE_NAME }}-${{ env.REPO_BRANCH }}-downloads-
            openwrt-staged-${{ env.DEVICE_NAME }}-downloads-

      - name: 1.5.prepare-source
        id: prepare
        env:
          OP_IP: ${{ github.event.inputs.OP_IP }}
          OP_author: ${{ github.event.inputs.OP_author }}
          CUSTOM_PLUGINS: ${{ github.event.inputs.CUSTOM_PLUGINS }}
        run: |
          chmod +x sh/staged-prepare.sh
          sh/staged-prepare.sh
          cd "$SOURCE_NAME"
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 1.6.save-download-cache
        uses: actions/cache/save@v5
        with:
          path: /workdir/openwrt/dl
          key: openwrt-staged-${{ env.DEVICE_NAME }}-${{ env.REPO_BRANCH }}-downloads-${{ github.run_id }}

  toolchain-kernel:
    name: 2.toolchain-kernel
    runs-on: ubuntu-22.04
    needs: prepare-source
    steps:
      - name: 2.1.checkout-control-repo
        uses: actions/checkout@v6

      - name: 2.2.install-build-env
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d
          sudo apt-get update
          sudo apt-get install -y tar build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3 python3-pip python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget subversion patch upx-ucl autoconf automake curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 uglifyjs msmtp texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev rename qemu-utils clang llvm
          sudo apt-get clean

      - name: 2.3.restore-download-cache
        uses: actions/cache/restore@v5
        with:
          path: /workdir/openwrt/dl
          key: openwrt-staged-${{ env.DEVICE_NAME }}-${{ needs.prepare-source.outputs.release_tag }}-downloads-${{ github.run_id }}
          restore-keys: |
            openwrt-staged-${{ env.DEVICE_NAME }}-${{ needs.prepare-source.outputs.release_tag }}-downloads-
            openwrt-staged-${{ env.DEVICE_NAME }}-${{ env.REPO_BRANCH }}-downloads-
            openwrt-staged-${{ env.DEVICE_NAME }}-downloads-

      - name: 2.4.prepare-source
        env:
          STAGED_RELEASE_TAG: ${{ needs.prepare-source.outputs.release_tag }}
          OP_IP: ${{ github.event.inputs.OP_IP }}
          OP_author: ${{ github.event.inputs.OP_author }}
          CUSTOM_PLUGINS: ${{ github.event.inputs.CUSTOM_PLUGINS }}
        run: |
          chmod +x sh/staged-prepare.sh
          sh/staged-prepare.sh

      - name: 2.5.compile-toolchain-kernel-bpf
        run: |
          cd "$SOURCE_NAME"
          make tools/install -j$(nproc) || yes n | make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || yes n | make toolchain/install -j1 V=s
          make target/compile -j$(nproc) || yes n | make target/compile -j1 V=s
          make package/kernel/bpf-headers/compile V=s || yes n | make package/kernel/bpf-headers/compile V=s

      - name: 2.6.save-toolchain-cache
        uses: actions/cache/save@v5
        with:
          path: |
            /workdir/openwrt/dl
            /workdir/openwrt/staging_dir
            /workdir/openwrt/build_dir/host
            /workdir/openwrt/build_dir/hostpkg
            /workdir/openwrt/build_dir/toolchain-*
            /workdir/openwrt/build_dir/target-*
          key: openwrt-staged-${{ env.DEVICE_NAME }}-${{ needs.prepare-source.outputs.release_tag }}-toolchain-${{ github.run_id }}

  daed-precheck:
    name: 3.daed-precheck
    runs-on: ubuntu-22.04
    needs: [prepare-source, toolchain-kernel]
    steps:
      - name: 3.1.checkout-control-repo
        uses: actions/checkout@v6

      - name: 3.2.install-build-env
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d
          sudo apt-get update
          sudo apt-get install -y tar build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3 python3-pip python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget subversion patch upx-ucl autoconf automake curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 uglifyjs msmtp texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev rename qemu-utils clang llvm
          sudo apt-get clean

      - name: 3.3.restore-toolchain-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            /workdir/openwrt/dl
            /workdir/openwrt/staging_dir
            /workdir/openwrt/build_dir/host
            /workdir/openwrt/build_dir/hostpkg
            /workdir/openwrt/build_dir/toolchain-*
            /workdir/openwrt/build_dir/target-*
          key: openwrt-staged-${{ env.DEVICE_NAME }}-${{ needs.prepare-source.outputs.release_tag }}-toolchain-${{ github.run_id }}
          restore-keys: |
            openwrt-staged-${{ env.DEVICE_NAME }}-${{ needs.prepare-source.outputs.release_tag }}-toolchain-
            openwrt-staged-${{ env.DEVICE_NAME }}-toolchain-

      - name: 3.4.prepare-source
        env:
          STAGED_RELEASE_TAG: ${{ needs.prepare-source.outputs.release_tag }}
          OP_IP: ${{ github.event.inputs.OP_IP }}
          OP_author: ${{ github.event.inputs.OP_author }}
          CUSTOM_PLUGINS: ${{ github.event.inputs.CUSTOM_PLUGINS }}
        run: |
          chmod +x sh/staged-prepare.sh
          sh/staged-prepare.sh

      - name: 3.5.compile-daed-only
        run: |
          cd "$SOURCE_NAME"
          echo "::group::host toolchain validation"
          if [ ! -x staging_dir/host/bin/libdeflate-gzip ]; then
            echo "Missing staging_dir/host/bin/libdeflate-gzip; rebuilding OpenWrt libdeflate host tool"
            rm -rf build_dir/host/libdeflate-* build_dir/hostpkg/libdeflate-*
            rm -f staging_dir/host/stamp/.libdeflate* staging_dir/hostpkg/stamp/.libdeflate*
            make tools/libdeflate/clean V=s || true
            make package/libs/libdeflate/host/clean V=s || true
            make tools/libdeflate/install V=s || make tools/install -j$(nproc) || yes n | make tools/install -j1 V=s
            [ -x staging_dir/host/bin/libdeflate-gzip ] || make package/libs/libdeflate/host/compile V=s || true
          fi
          if [ ! -x staging_dir/host/bin/libdeflate-gzip ]; then
            echo "ERROR: staging_dir/host/bin/libdeflate-gzip is still missing after rebuild"
            find staging_dir/host -maxdepth 3 -iname '*libdeflate*' -o -iname '*gzip*' || true
            exit 1
          fi
          if ! find staging_dir/toolchain-* -path '*/bin/aarch64-openwrt-linux-musl-gcc' -type f -executable -print -quit | grep -q .; then
            echo "Missing aarch64-openwrt-linux-musl-gcc; rebuilding OpenWrt toolchain"
            make toolchain/install -j$(nproc) || yes n | make toolchain/install -j1 V=s
          fi
          ls -l staging_dir/host/bin/libdeflate-gzip || true
          find staging_dir/toolchain-* -path '*/bin/aarch64-openwrt-linux-musl-gcc' -type f -executable -print -quit || true
          echo "::endgroup::"
          echo "::group::daed package diagnostics"
          grep -E 'CONFIG_PACKAGE_(daed|luci-app-daed|luci-i18n-daed)|CONFIG_DAE|CONFIG_DAED|CONFIG_KERNEL_DEBUG_INFO_BTF' .config || true
          grep -nE 'corepack|pnpm|apps/web|webrender|dist/index.html' package/porxy/daed/Makefile || true
          sed -n '1,260p' package/porxy/daed/Makefile || true
          echo "::endgroup::"
          rm -rf dl/go-mod-cache
          make package/porxy/daed/clean V=s
          make package/porxy/daed/compile -j$(nproc) V=s || {
            echo "::group::daed failure diagnostics"
            find build_dir -path '*/daed-*/apps/web/*' -type f | sort | tail -200 || true
            find build_dir -path '*/daed-*/apps/web/dist/*' -type f | sort | head -100 || true
            echo "::endgroup::"
            yes n | make package/porxy/daed/compile -j1 V=s
          }

      - name: 3.6.save-daed-cache
        uses: actions/cache/save@v5
        with:
          path: |
            /workdir/openwrt/dl
            /workdir/openwrt/staging_dir
            /workdir/openwrt/build_dir/host
            /workdir/openwrt/build_dir/hostpkg
            /workdir/openwrt/build_dir/toolchain-*
            /workdir/openwrt/build_dir/target-*
            /workdir/openwrt/bin/packages
          key: openwrt-staged-${{ env.DEVICE_NAME }}-${{ needs.prepare-source.outputs.release_tag }}-daed-${{ github.run_id }}

  packages:
    name: 4.packages
    runs-on: ubuntu-22.04
    needs: [prepare-source, daed-precheck]
    steps:
      - name: 4.1.checkout-control-repo
        uses: actions/checkout@v6

      - name: 4.2.install-build-env
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d
          sudo apt-get update
          sudo apt-get install -y tar build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3 python3-pip python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget subversion patch upx-ucl autoconf automake curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 uglifyjs msmtp texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev rename qemu-utils clang llvm
          sudo apt-get clean

      - name: 4.3.restore-daed-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            /workdir/openwrt/dl
            /workdir/openwrt/staging_dir
            /workdir/openwrt/build_dir/host
            /workdir/openwrt/build_dir/hostpkg
            /workdir/openwrt/build_dir/toolchain-*
            /workdir/openwrt/build_dir/target-*
            /workdir/openwrt/bin/packages
          key: openwrt-staged-${{ env.DEVICE_NAME }}-${{ needs.prepare-source.outputs.release_tag }}-daed-${{ github.run_id }}
          restore-keys: |
            openwrt-staged-${{ env.DEVICE_NAME }}-${{ needs.prepare-source.outputs.release_tag }}-daed-
            openwrt-staged-${{ env.DEVICE_NAME }}-${{ needs.prepare-source.outputs.release_tag }}-toolchain-
            openwrt-staged-${{ env.DEVICE_NAME }}-daed-

      - name: 4.4.prepare-source
        env:
          STAGED_RELEASE_TAG: ${{ needs.prepare-source.outputs.release_tag }}
          OP_IP: ${{ github.event.inputs.OP_IP }}
          OP_author: ${{ github.event.inputs.OP_author }}
          CUSTOM_PLUGINS: ${{ github.event.inputs.CUSTOM_PLUGINS }}
        run: |
          chmod +x sh/staged-prepare.sh
          sh/staged-prepare.sh

      - name: 4.5.compile-packages
        run: |
          cd "$SOURCE_NAME"
          make package/compile -j$(nproc) || yes n | make package/compile -j1 V=s

      - name: 4.6.save-packages-cache
        uses: actions/cache/save@v5
        with:
          path: |
            /workdir/openwrt/dl
            /workdir/openwrt/staging_dir
            /workdir/openwrt/build_dir/host
            /workdir/openwrt/build_dir/hostpkg
            /workdir/openwrt/build_dir/toolchain-*
            /workdir/openwrt/build_dir/target-*
            /workdir/openwrt/bin/packages
          key: openwrt-staged-${{ env.DEVICE_NAME }}-${{ needs.prepare-source.outputs.release_tag }}-packages-${{ github.run_id }}

  images:
    name: 5.images
    runs-on: ubuntu-22.04
    needs: [prepare-source, packages]
    steps:
      - name: 5.1.checkout-control-repo
        uses: actions/checkout@v6

      - name: 5.2.install-build-env
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d
          sudo apt-get update
          sudo apt-get install -y tar build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3 python3-pip python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget subversion patch upx-ucl autoconf automake curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 uglifyjs msmtp texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev rename qemu-utils clang llvm
          sudo apt-get clean

      - name: 5.3.restore-packages-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            /workdir/openwrt/dl
            /workdir/openwrt/staging_dir
            /workdir/openwrt/build_dir/host
            /workdir/openwrt/build_dir/hostpkg
            /workdir/openwrt/build_dir/toolchain-*
            /workdir/openwrt/build_dir/target-*
            /workdir/openwrt/bin/packages
          key: openwrt-staged-${{ env.DEVICE_NAME }}-${{ needs.prepare-source.outputs.release_tag }}-packages-${{ github.run_id }}
          restore-keys: |
            openwrt-staged-${{ env.DEVICE_NAME }}-${{ needs.prepare-source.outputs.release_tag }}-packages-
            openwrt-staged-${{ env.DEVICE_NAME }}-${{ needs.prepare-source.outputs.release_tag }}-daed-
            openwrt-staged-${{ env.DEVICE_NAME }}-packages-

      - name: 5.4.prepare-source
        env:
          STAGED_RELEASE_TAG: ${{ needs.prepare-source.outputs.release_tag }}
          OP_IP: ${{ github.event.inputs.OP_IP }}
          OP_author: ${{ github.event.inputs.OP_author }}
          CUSTOM_PLUGINS: ${{ github.event.inputs.CUSTOM_PLUGINS }}
        run: |
          chmod +x sh/staged-prepare.sh
          sh/staged-prepare.sh

      - name: 5.5.package-and-build-images
        run: |
          cd "$SOURCE_NAME"
          make package/install -j$(nproc) || yes n | make package/install -j1 V=s
          make target/install -j$(nproc) || yes n | make target/install -j1 V=s
          make package/index

      - name: 5.6.organize-firmware
        run: |
          cd "$SOURCE_NAME/bin/targets"/*/*
          rm -rf packages *.buildinfo profiles.json *.manifest *bl2.bin *kernel.bin *.sha sha256sums
          mkdir -p "$GITHUB_WORKSPACE/firmware"
          cp -fpR ./* "$GITHUB_WORKSPACE/firmware/"

      - name: 5.7.upload-firmware-artifact
        uses: actions/upload-artifact@v6
        with:
          name: openwrt-staged-firmware
          path: firmware/*
          retention-days: 7

  release:
    name: 6.release
    runs-on: ubuntu-22.04
    needs: [prepare-source, images]
    steps:
      - name: 6.1.download-firmware-artifact
        uses: actions/download-artifact@v6
        with:
          name: openwrt-staged-firmware
          path: firmware

      - name: 6.2.upload-release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare-source.outputs.release_tag }}-${{ needs.prepare-source.outputs.build_date }}-staged
          files: firmware/*
          body: |
            ====================固件信息=======================
            分支：${{ needs.prepare-source.outputs.release_tag }}
            静态IP：${{ github.event.inputs.OP_IP }}
            插件：${{ github.event.inputs.CUSTOM_PLUGINS }}
            定制作者：${{ github.event.inputs.OP_author }}
            默认密码：root/password
            Workflow：openwrt-staged
