name: openwrt-staged-daed-only

on:
  workflow_dispatch:
    inputs:
      OP_IP:
        description: '静态IP地址'
        required: false
        default: '192.168.2.1'
        type: string
      OP_author:
        description: '定制作者'
        required: false
        default: 'kubulama'
        type: string
      CUSTOM_PLUGINS:
        description: '自定义插件名称，用空格分隔'
        required: false
        default: 'luci-app-zerotier luci-app-socat luci-app-samba4 luci-theme-m3e luci-app-ttyd luci-app-diskman luci-app-daed luci-i18n-daed-zh-cn'
        type: string
      OPENWRT_RELEASE_TAG:
        description: 'OpenWrt源码标签，留空则使用最新v25.*标签'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  DIY_P1_SH: sh/op.sh
  SOURCE_NAME: openwrt
  REPO_URL: https://github.com/shiyu1314/openwrt-source
  REPO_BRANCH: openwrt-25.12
  DEVICE_NAME: mt7981-multi

jobs:
  daed-only:
    name: daed-only
    runs-on: ubuntu-22.04
    steps:
      - name: 1.checkout-control-repo
        uses: actions/checkout@v6

      - name: 2.install-build-env
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d
          sudo apt-get update
          sudo apt-get install -y tar build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3 python3-pip python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget subversion patch upx-ucl autoconf automake curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 uglifyjs msmtp texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev rename qemu-utils clang llvm
          sudo apt-get clean

      - name: 3.prepare-source
        id: prepare
        env:
          STAGED_RELEASE_TAG: ${{ github.event.inputs.OPENWRT_RELEASE_TAG }}
          OP_IP: ${{ github.event.inputs.OP_IP }}
          OP_author: ${{ github.event.inputs.OP_author }}
          CUSTOM_PLUGINS: ${{ github.event.inputs.CUSTOM_PLUGINS }}
        run: |
          chmod +x sh/staged-prepare.sh
          sh/staged-prepare.sh

      - name: 4.restore-toolchain-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            /workdir/openwrt/dl
            /workdir/openwrt/staging_dir
            /workdir/openwrt/build_dir/host
            /workdir/openwrt/build_dir/hostpkg
            /workdir/openwrt/build_dir/toolchain-*
            /workdir/openwrt/build_dir/target-*
          key: openwrt-staged-${{ env.DEVICE_NAME }}-${{ steps.prepare.outputs.release_tag }}-toolchain-${{ github.run_id }}
          restore-keys: |
            openwrt-staged-${{ env.DEVICE_NAME }}-${{ steps.prepare.outputs.release_tag }}-toolchain-
            openwrt-staged-${{ env.DEVICE_NAME }}-${{ steps.prepare.outputs.release_tag }}-daed-
            openwrt-staged-${{ env.DEVICE_NAME }}-${{ steps.prepare.outputs.release_tag }}-packages-

      - name: 5.daed-precheck
        run: |
          chmod +x sh/staged-daed-precheck.sh
          sh/staged-daed-precheck.sh

      - name: 6.save-daed-cache
        uses: actions/cache/save@v5
        with:
          path: |
            /workdir/openwrt/dl
            /workdir/openwrt/staging_dir
            /workdir/openwrt/build_dir/host
            /workdir/openwrt/build_dir/hostpkg
            /workdir/openwrt/build_dir/toolchain-*
            /workdir/openwrt/build_dir/target-*
            /workdir/openwrt/bin/packages
            /workdir/openwrt/bin/targets
          key: openwrt-staged-${{ env.DEVICE_NAME }}-${{ steps.prepare.outputs.release_tag }}-daed-${{ github.run_id }}
